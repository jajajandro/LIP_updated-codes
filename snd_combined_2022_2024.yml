
General:
  Measurement: "SND_0mu_PRL"
  POI: "Signal_norm"
  HistogramFolder: "histograms/" # output histograms folder
  InputPath: "input/{RegionPath}/{SamplePath}/"

  Fixed:
    - Name: "Luminosity_Scale_2022_stan" # Must match the NormFactor name
      Value: 1 # Set this to the desired luminosity scale for 2022
    - Name: "Luminosity_Scale_2024_stan" # Must match the NormFactor name
      Value: 1  # Set this to the desired luminosity scale for 2024 (20 for trial, 118.6 for final)
    #- Name: "Luminosity_Scale_2022_MC" # Must match the NormFactor name
      #Value: 102 # Set this to the desired luminosity scale for 2022
    #- Name: "Luminosity_Scale_2024_MC" # Must match the NormFactor name
      #Value: 102  # Set this to the desired luminosity scale for 2024 (20 for trial, 118.6 for final)  

Regions:
  - Name: "Signal_region_2022"
    RegionPath: "2022"
    Variable: "dens_sel"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000)"
    Binning: [11000, 14000, 17000, 25000, 30000, 40000] 
  - Name: "Signal_region_2024"
    RegionPath: "2024"
    Variable: "dens_sel"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000)"
    Binning: [11000, 14000, 17000, 25000, 30000, 40000]

Samples:
  # Data and HadronBackground must be assigned to ALL regions they are used in.
  # The HadronBackground was missing a Regions list.

  - Name: "Data"
    Tree: "snd_0mu_summaryTree"
    SamplePath: "snd_0mu_summaryTree_data_full.root"
    Data: True

  - Name: "HadronBackground"
    Tree: "snd_0mu_summaryTree"
    SamplePath: "snd_0mu_summaryTree_hadron.root"
    Weight: "weight"

  - Name: "Signal"
    Tree: "snd_0mu_summaryTree"
    #SamplePath: "snd_0mu_summaryTree_nu.root"
    SamplePath: "snd_0mu_summaryTree_nu_MCreweight.root"
    Weight: "weight"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000) & (cc == 1) & (abs(pdg) == 12)"

  - Name: "NumuBackground"
    Tree: "snd_0mu_summaryTree"
    #SamplePath: "snd_0mu_summaryTree_nu.root"
    SamplePath: "snd_0mu_summaryTree_nu_MCreweight.root"
    Weight: "weight"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000) & (cc == 1) & (abs(pdg) == 14)"
  
  - Name: "NutauBackground"
    Tree: "snd_0mu_summaryTree"
    #SamplePath: "snd_0mu_summaryTree_nu.root"
    SamplePath: "snd_0mu_summaryTree_nu_MCreweight.root"
    Weight: "weight"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000) & (cc == 1) & (abs(pdg) == 16)"    
  
  - Name : NCBackground
    Tree: "snd_0mu_summaryTree"
    #SamplePath: "snd_0mu_summaryTree_nu.root"
    SamplePath: "snd_0mu_summaryTree_nu_MCreweight.root"
    Weight: "weight"
    Filter: "(dens_sel2 >= 20) & (dens_sel > 11000) & (cc == 0)"

