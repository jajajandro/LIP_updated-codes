# Other systematics s 
  - Name: "s_systematic_electron"
    Up:
      Normalization: 1
    Down:
      Normalization: 1
    Type: "NormPlusShape"
    Samples: "Signal"
  - Name: "s_systematic_NC"
    Up:
      Normalization: 1
      Filter: "(dens_sel2 >= 20) & (dens_sel > 11000) & (cc == 0)"
    Down:
      Normalization: 1
