    Type: "Normalization"
    Samples: "HadronBackground"
  - Name: "NutauSyst"
    Up:
      Normalization: 1.0
    Down:
      Normalization: 1.0
    Type: "Normalization"
    Samples: "NutauBackground"

NormFactors:
  - Name: "Signal_norm"
    Samples: "Signal"
    Nominal: 1
    Bounds: [0, 10]
  - Name: "Luminosity_Scale_2022_stan"
    Samples: ["Signal", "Data", "HadronBackground"]
     # Nominal is the desired scale factor (e.g., 68.55 fb^-1 / 1 fb^-1)
    Regions: ["Signal_region_2022"]
    Nominal: 1
    Bounds: [0, 10000]
  - Name: "Luminosity_Scale_2024_stan"
    Regions: ["Signal_region_2024"]
     # Nominal is the desired scale factor (e.g., 118.6 fb^-1 / 1 fb^-1)
    Samples: ["Signal", "Data", "HadronBackground"]
    Nominal: 1  # 20 for trial, 118.6 for final
    Bounds: [0, 10000]
